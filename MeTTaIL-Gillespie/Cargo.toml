[package]
name = "mettail-gillespie"
version = "0.1.0"
edition = "2021"
description = "Stochastic and quantum Gillespie simulation extensions for MeTTaIL rewrite rules"
license = "MIT"

[dependencies]
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
approx = "0.5"
